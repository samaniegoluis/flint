# Builds Flint's release packages for a tag, puts them in a draft GitHub release, checks
# that draft and publishes it (milestone 51, D-107, D-113, D-147). Run by hand only:
#
#   gh workflow run release.yml -f tag=v0.16.0      (or Actions → Release → Run workflow)
#   gh workflow run release.yml --ref <branch> -f tag=v0.16.0 -f run=linux-packages
#                                    # the Linux packages of <branch>'s commit only, no release
#
# The workflow holds no logic of its own (Principle 16): each step calls a script a
# person runs the same way on the Mac, Zorin or the Windows VM. guard checks the tag's
# commit is on main; a job per system builds its packages; draft makes the release a
# draft with SHA256SUMS, the signed manifest and the version's notes; publish downloads
# that draft, checks every file against SHA256SUMS and the manifest's signature, and
# publishes it (Latest), or leaves it a draft and fails.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, vX.Y.Z or vX.Y.Z-rc.N (on main)"
        required: true
        type: string
      run:
        description: "release: every package, drafted and published. linux-packages: the .deb and the .rpm of the run's own commit (--ref) built and tested, nothing released (milestone 83: timing the build and its cache)"
        required: false
        type: choice
        options: [release, linux-packages]
        default: release

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: The tag's commit is on main
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/release-draft.sh guard "$TAG"

  macos:
    needs: guard
    if: inputs.run == 'release'
    runs-on: macos-26
    timeout-minutes: 90
    # The Developer ID certificate and the notary key live here (milestone 79, D-158 (2));
    # the owner fills them from Infisical (/flint). The identity's name is a variable, not
    # a secret: it is in every signed file.
    environment: release
    env:
      FLINT_MACOS_SIGN_IDENTITY: ${{ vars.FLINT_MACOS_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: The pinned libraries, kept while scripts/deps-macos.sh is unchanged
        uses: actions/cache@v6
        with:
          path: build/deps/macos-arm64
          key: deps-macos-arm64-${{ hashFiles('scripts/deps-macos.sh') }}
      - name: cfire
        run: scripts/install-cfire.sh "$RUNNER_TEMP/cfire" >> "$GITHUB_PATH"
      - name: The signing keychain
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/macos/keychain.sh create >> "$GITHUB_ENV"
      - name: Package
        run: scripts/package.sh macos
      - name: Notarize
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: scripts/macos/notarize.sh dist/*-macos-arm64.zip
      - name: Remove the signing keychain
        if: always()
        run: '[[ -z "${FLINT_MACOS_KEYCHAIN:-}" ]] || scripts/macos/keychain.sh delete "$FLINT_MACOS_KEYCHAIN"'
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  # One job per format (milestone 83, D-161): each its own log, retried alone, and the
  # two built at once. Each keeps its build between runs: scripts/package.sh puts the
  # tree and cfire's caches in FLINT_PACKAGE_CACHE/<format>, restored here from the last
  # run with the same image (its Dockerfile pins cfire and the system), so a release
  # compiles only what changed since the one before.
  linux:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
    name: linux-${{ matrix.format }}
    env:
      FLINT_PACKAGE_CACHE: ~/flint-package-cache
    steps:
      # linux-packages builds the commit the run was started from (`--ref`), so a change
      # to the build can be timed before it is tagged; a release builds the tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.run == 'release' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
      - name: The build cache of the last run with this image
        uses: actions/cache@v6
        with:
          path: ~/flint-package-cache/${{ matrix.format }}
          key: linux-${{ matrix.format }}-${{ hashFiles('scripts/linux/package.Dockerfile', 'scripts/linux/package-tools.sh') }}-${{ github.run_id }}
          restore-keys: linux-${{ matrix.format }}-${{ hashFiles('scripts/linux/package.Dockerfile', 'scripts/linux/package-tools.sh') }}-
      # Each format builds in its own image (Ubuntu 24.04, Fedora 43; D-120), so the
      # runner needs only Docker and Node, both already there.
      - name: Package
        run: scripts/package.sh linux ${{ matrix.format }}
      - name: Installed, run and removed in clean containers
        run: scripts/linux/package-test.sh dist/*.${{ matrix.format }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.format }}
          path: dist/*.${{ matrix.format }}
          if-no-files-found: error

  windows:
    needs: guard
    if: inputs.run == 'release'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Checked out with LF endings: the scripts run in MSYS2's bash.
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      # MSYS2 itself and its CLANG64 shell; every package Flint needs is
      # windows/bin/setup.sh's, the same as on the Windows VM and windows/build.ps1.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: git
      - name: The pinned FreeRDP, cfire, WebView2 loader and Node, kept while their scripts are unchanged
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/flint-build/opt
          key: windows-opt-${{ hashFiles('windows/bin/setup.sh', 'windows/bin/freerdp.sh') }}
      # FLINT_WIN_HOME is %LOCALAPPDATA%\flint-build there (windows/bin/home.sh).
      - name: Setup
        run: windows/bin/setup.sh
      - name: Package
        run: scripts/package.sh windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  draft:
    needs: [macos, linux, windows]
    if: inputs.run == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The update manifest's signing key lives here and nowhere else in GitHub
    # (Principle 15, milestone 52); the owner fills it from Infisical (/flint).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Draft release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          FLINT_UPDATE_SIGNING_KEY: ${{ secrets.FLINT_UPDATE_SIGNING_KEY }}
        run: scripts/release-draft.sh draft "$TAG" packages
      - name: Check and publish
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-draft.sh publish "$TAG"
