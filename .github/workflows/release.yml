# Builds Flint's release packages for a tag and puts them in a draft GitHub release
# (milestone 51, D-107, D-113). Run by hand only, until the self-update is trusted:
#
#   gh workflow run release.yml -f tag=v0.16.0      (or Actions → Release → Run workflow)
#
# The workflow holds no logic of its own (Principle 16): each step calls a script a
# person runs the same way on the Mac, Zorin or the Windows VM. guard checks the tag's
# commit is on main; a job per system builds its packages; draft makes the release a
# draft with SHA256SUMS and the version's notes, which the owner looks at and publishes.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, vX.Y.Z or vX.Y.Z-rc.N (on main)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: The tag's commit is on main
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/release-draft.sh guard "$TAG"

  macos:
    needs: guard
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: The pinned libraries, kept while scripts/deps-macos.sh is unchanged
        uses: actions/cache@v6
        with:
          path: build/deps/macos-arm64
          key: deps-macos-arm64-${{ hashFiles('scripts/deps-macos.sh') }}
      - name: cfire
        run: scripts/install-cfire.sh "$RUNNER_TEMP/cfire" >> "$GITHUB_PATH"
      # `cfire build` hung here twice with no output (ROADMAP §7, rule 9). Diagnosis only,
      # no build logic: past 25 minutes a watcher writes every cfire process's stacks
      # (`sample`, twice a minute apart), its open files and the process tree; the step
      # ends at 35, so the job keeps time to upload them. It lives here, not in scripts/,
      # because the job runs the scripts of the tag being built.
      - name: Package
        timeout-minutes: 35
        run: |
          out="$RUNNER_TEMP/hang"; mkdir -p "$out"
          (
            sleep 1500
            ps -axo pid,ppid,etime,stat,%cpu,rss,args > "$out/ps.txt" 2>&1
            for p in $(pgrep -x cfire); do
              sample "$p" 10 -file "$out/cfire-$p.sample.txt" >/dev/null 2>&1
              lsof -p "$p" > "$out/cfire-$p.lsof.txt" 2>&1
            done
            sleep 60
            for p in $(pgrep -x cfire); do sample "$p" 5 -file "$out/cfire-$p.sample-2.txt" >/dev/null 2>&1; done
            ps -axo pid,ppid,etime,stat,%cpu,rss,args > "$out/ps-2.txt" 2>&1
          ) </dev/null >/dev/null 2>&1 &
          watcher=$!
          status=0
          scripts/package.sh macos || status=$?
          kill "$watcher" 2>/dev/null || true
          exit "$status"
      - name: The stacks of a hung build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-hang
          path: ${{ runner.temp }}/hang
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      # Each format builds in its own image (Ubuntu 24.04, Fedora 43; D-120), so the
      # runner needs only Docker and Node, both already there.
      - name: Package
        run: scripts/package.sh linux
      - name: Installed, run and removed in clean containers
        run: scripts/linux/package-test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  windows:
    needs: guard
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Checked out with LF endings: the scripts run in MSYS2's bash.
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      # MSYS2 itself and its CLANG64 shell; every package Flint needs is
      # windows/bin/setup.sh's, the same as on the Windows VM and windows/build.ps1.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: git
      - name: The pinned FreeRDP, cfire, WebView2 loader and Node, kept while their scripts are unchanged
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/flint-build/opt
          key: windows-opt-${{ hashFiles('windows/bin/setup.sh', 'windows/bin/freerdp.sh') }}
      # FLINT_WIN_HOME is %LOCALAPPDATA%\flint-build there (windows/bin/home.sh).
      - name: Setup
        run: windows/bin/setup.sh
      - name: Package
        run: scripts/package.sh windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  draft:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The update manifest's signing key lives here and nowhere else in GitHub
    # (Principle 15, milestone 52); the owner fills it from Infisical (/flint).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Draft release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          FLINT_UPDATE_SIGNING_KEY: ${{ secrets.FLINT_UPDATE_SIGNING_KEY }}
        run: scripts/release-draft.sh draft "$TAG" packages
