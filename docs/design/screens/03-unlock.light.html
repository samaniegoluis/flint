</div>

<button type="button" class="icon-btn" aria-label="Show password"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-eye"></use></svg></button>

</div>
</div>

<button type="button" class="btn btn-ghost btn-sm">Open file…<span class="kbd">⌘O</span></button>
</div>
</form>
