<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Flint A — Unlock vault</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
a{color:#F2A35E}a:hover{color:#FFB877}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:none}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.kbd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;line-height:16px;color:#A8A49C;border:1px solid #33363C;border-radius:4px;padding:0 5px;background:#1A1C20}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #0E0F11; border: 1px solid #2A2D33; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Geist', system-ui, sans-serif; color: #E8E4DC; font-size: 13px">

<header style="height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid #1F2125; background: #121316">
<div style="display: flex; gap: 8px; width: 70px" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span></div>
<div style="flex: 1; text-align: center; font-size: 12px; color: #8F8B84">Flint — Work (locked)</div>
<div style="width: 70px"></div>
</header>

<div style="flex: 1; display: flex; min-height: 0">
<nav aria-label="Primary" style="width: 48px; flex-shrink: 0; border-right: 1px solid #1F2125; background: #111214; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; opacity: 0.45">
<span style="width: 36px; height: 36px; border-radius: 7px; background: #1E2024"></span>
<span style="width: 36px; height: 36px; border-radius: 7px"></span>
</nav>

<aside aria-label="Vault sidebar (locked)" style="width: 264px; flex-shrink: 0; background: #131417; border-right: 1px solid #1F2125; display: flex; flex-direction: column; padding: 10px; gap: 10px; box-sizing: border-box">
<div style="height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 1px solid #2A2D33; border-radius: 7px; background: #17181B">
<span style="width: 24px; height: 24px; border-radius: 6px; background: #3A2617; color: #F29A52; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center">W</span>
<span style="flex: 1; font-weight: 600">Work</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F8B84" stroke-width="1.8" stroke-linecap="round" role="img" aria-label="Locked"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 8px 4px; opacity: 0.5" aria-hidden="true">
<span style="height: 8px; width: 60%; border-radius: 4px; background: #22252A"></span>
<span style="height: 8px; width: 78%; border-radius: 4px; background: #1D1F23; margin-left: 14px"></span>
<span style="height: 8px; width: 70%; border-radius: 4px; background: #1D1F23; margin-left: 14px"></span>
<span style="height: 8px; width: 52%; border-radius: 4px; background: #22252A"></span>
<span style="height: 8px; width: 66%; border-radius: 4px; background: #1D1F23; margin-left: 14px"></span>
<span style="height: 8px; width: 46%; border-radius: 4px; background: #22252A"></span>
</div>
</aside>

<main style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; background: #0B0C0E">
<form aria-label="Unlock vault" style="width: 400px; display: flex; flex-direction: column; gap: 20px; padding: 32px; box-sizing: border-box; background: #141518; border: 1px solid #2A2D33; border-radius: 10px">
<div style="display: flex; align-items: center; gap: 14px">
<svg width="40" height="40" viewBox="0 0 24 24" role="img" aria-label="Flint"><path d="M9 3L17 7L19 15L12 21L5 16L4 8Z" fill="#2E3137"></path><path d="M9 3L12 11L17 7Z" fill="#4A4E56"></path><path d="M12 11L19 15L12 21Z" fill="#24272C"></path><path d="M12 11L5 16L4 8L9 3Z" fill="#3A3E45"></path><path d="M20.5 1.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z" fill="#F29A52"></path></svg>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 12px; color: #A8A49C">Unlock vault</span>
<span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Work</span>
</div>
</div>
<div class="mono" style="font-size: 11.5px; color: #A8A49C; padding: 8px 10px; background: #0F1012; border: 1px solid #23262B; border-radius: 6px">~/vaults/work.flint</div>
<p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #A8A49C">No key for this vault is cached on this Mac yet. Enter the vault password once to continue.</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pw" style="font-size: 12px; color: #C9C5BD">Vault password</label>
<div style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border: 1px solid #F29A52; border-radius: 7px; background: #0F1012; box-shadow: 0 0 0 3px rgba(242,154,82,0.16)">
<input id="pw" type="password" value="correct-horse-batt" style="flex: 1; min-width: 0; font-size: 14px; letter-spacing: 0.12em">
<button type="button" aria-label="Show password (⌥⌘P)" style="color: #8F8B84; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
<label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer">
<input type="checkbox" checked style="width: 16px; height: 16px; margin: 1px 0 0; accent-color: #F29A52">
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px">Remember on this device</span><span style="font-size: 12px; color: #8F8B84">Stores the vault key in macOS Keychain. Next launch unlocks automatically.</span></span>
</label>
<div style="display: flex; align-items: center; gap: 10px; padding-top: 4px">
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid #2E3137; border-radius: 7px; color: #C9C5BD; font-size: 13px">Switch vault <span class="kbd">⇧⌘O</span></button>
<span style="flex: 1"></span>
<button type="submit" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 7px; background: #F29A52; color: #1A0F06; font-weight: 600; font-size: 13px">Unlock <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.75">↵</span></button>
</div>
</form>
</main>
</div>
</div>
</body>
</html>
