<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Flint B — Unlock vault</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
a{color:#F2A35E}a:hover{color:#FFB877}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:none}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.kbd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;line-height:16px;color:#A8A49C;border:1px solid #33363C;border-radius:4px;padding:0 5px;background:#1A1C20}
</style>
</head>
<body>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; background: #0B0C0E; border: 1px solid #2A2D33; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Geist', system-ui, sans-serif; color: #E8E4DC; font-size: 13px">

<header style="height: 34px; flex-shrink: 0; display: flex; align-items: center; padding: 0 14px">
<div style="display: flex; gap: 8px" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span></div>
</header>

<main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 60px">
<form aria-label="Unlock vault" style="width: 460px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<svg width="36" height="36" viewBox="0 0 24 24" role="img" aria-label="Flint"><path d="M9 3L17 7L19 15L12 21L5 16L4 8Z" fill="#2E3137"></path><path d="M9 3L12 11L17 7Z" fill="#4A4E56"></path><path d="M12 11L19 15L12 21Z" fill="#24272C"></path><path d="M12 11L5 16L4 8L9 3Z" fill="#3A3E45"></path><path d="M20.5 1.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z" fill="#F29A52"></path></svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Work</h1>
<span class="mono" style="font-size: 12px; color: #A8A49C">~/vaults/work.flint</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pw" style="font-size: 12px; color: #A8A49C; padding-left: 2px">Vault password — no key cached on this machine</label>
<div class="mono" style="height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; border: 1px solid #F29A52; border-radius: 8px; background: #111214; box-shadow: 0 0 0 3px rgba(242,154,82,0.14)">
<span style="color: #F29A52; font-size: 15px" aria-hidden="true">❯</span>
<input id="pw" type="password" value="correct-horse-batt" style="flex: 1; min-width: 0; font-size: 15px; letter-spacing: 0.14em">
<button type="submit" aria-label="Unlock" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; background: #F29A52; color: #1A0F06; font-family: 'Geist', sans-serif; font-weight: 600; font-size: 12.5px">Unlock ↵</button>
</div>
</div>

<label style="display: flex; align-items: center; gap: 10px; padding-left: 2px; cursor: pointer">
<input type="checkbox" checked style="width: 15px; height: 15px; margin: 0; accent-color: #F29A52">
<span style="font-size: 13px">Remember on this device</span>
<span style="font-size: 12px; color: #8F8B84">· Linux Secret Service / macOS Keychain</span>
</label>

<div style="display: flex; justify-content: center; gap: 20px; padding-top: 18px; border-top: 1px solid #1A1C20; font-size: 12px; color: #8F8B84">
<button type="button" style="display: flex; align-items: center; gap: 6px; color: #C9C5BD"><span class="kbd">⇧⌘O</span>Switch vault</button>
<button type="button" style="display: flex; align-items: center; gap: 6px; color: #C9C5BD"><span class="kbd">⌘O</span>Open file…</button>
<button type="button" style="display: flex; align-items: center; gap: 6px; color: #C9C5BD"><span class="kbd">⌥⌘P</span>Show password</button>
</div>
</form>
</main>

<div class="mono" style="position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 11px; color: #8F8B84">flint 0.9.0 · vault format v2 · argon2id</div>
</div>
</body>
</html>
