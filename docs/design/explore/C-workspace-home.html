<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Flint C — Home</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
a{color:#F2A35E}a:hover{color:#FFB877}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;background:none;border:0;outline:none}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.kbd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;line-height:16px;color:#A8A49C;border:1px solid #33363C;border-radius:4px;padding:0 5px;background:#1A1C20}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #0E0F11; border: 1px solid #2A2D33; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Geist', system-ui, sans-serif; color: #E8E4DC; font-size: 13px">

<header style="height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px; background: #111214; border-bottom: 1px solid #1F2125">
<div style="display: flex; gap: 8px; width: 62px" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span></div>
<button aria-label="Switch vault — Work (⇧⌘O)" style="height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; border-radius: 6px; border: 1px solid #2A2D33">
<span style="width: 18px; height: 18px; border-radius: 4px; background: #3A2617; color: #F29A52; font-weight: 600; font-size: 10.5px; display: flex; align-items: center; justify-content: center">W</span>
<span style="font-weight: 600; font-size: 12.5px">Work</span>
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8A49C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<div style="flex: 1"></div>
<button aria-label="Command palette (⌘K)" style="height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 6px; border: 1px solid #2A2D33; color: #8F8B84; font-size: 12px; width: 170px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg><span style="flex: 1">Search</span><span class="kbd">⌘K</span></button>
</header>

<div style="flex: 1; display: flex; min-height: 0">
<nav aria-label="Primary" style="width: 64px; flex-shrink: 0; background: #111214; border-right: 1px solid #1F2125; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px">
<button aria-label="Home (⌘0)" style="position: relative; width: 52px; height: 48px; border-radius: 8px; background: #1E2024; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #F29A52; font-size: 10.5px"><span style="position: absolute; left: -6px; top: 14px; width: 2px; height: 20px; border-radius: 2px; background: #F29A52"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</button>
<span style="width: 28px; height: 1px; background: #24272C; margin: 2px 0"></span>
<button aria-label="Workspace Deploy v2.15 (⌘1)" style="width: 52px; height: 48px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #A8A49C; font-size: 10.5px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="8" height="18" rx="1.5"></rect><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="13" width="8" height="8" rx="1.5"></rect></svg>Deploy</button>
<button aria-label="Workspace Homelab (⌘2)" style="width: 52px; height: 48px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #A8A49C; font-size: 10.5px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="8" height="18" rx="1.5"></rect><rect x="13" y="3" width="8" height="18" rx="1.5"></rect></svg>Homelab</button>
<span style="width: 28px; height: 1px; background: #24272C; margin: 2px 0"></span>
<button aria-label="SSH keys (⇧⌘K)" style="width: 52px; height: 48px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #A8A49C; font-size: 10.5px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"></path></svg>Keys</button>
<button aria-label="Credentials (⇧⌘C)" style="width: 52px; height: 48px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #A8A49C; font-size: 10.5px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16c.6-1.5 1.8-2.2 3-2.2s2.4.7 3 2.2M14 10h4M14 13h3"></path></svg>Logins</button>
<div style="flex: 1"></div>
<button aria-label="Settings (⌘,)" style="width: 52px; height: 48px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #A8A49C; font-size: 10.5px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>Settings</button>
</nav>

<main style="flex: 1; min-width: 0; padding: 22px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Hosts</h1>
<span style="font-size: 12px; color: #8F8B84">24 in Work · 4 connected</span>
<span style="flex: 1"></span>
<label style="width: 240px; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; border: 1px solid #2A2D33; border-radius: 6px; background: #141518; color: #8F8B84">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
<input aria-label="Filter hosts" placeholder="Filter by name, tag, IP" style="flex: 1; min-width: 0; font-size: 12.5px"><span class="kbd">/</span>
</label>
<button style="height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #2A2D33; border-radius: 6px; color: #C9C5BD; font-size: 12.5px">Open selected in workspace <span class="kbd">⌘↵</span></button>
<button style="height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 6px; background: #F29A52; color: #1A0F06; font-weight: 600; font-size: 12.5px">New host <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; opacity: 0.75">⌘N</span></button>
</div>

<section aria-label="Production" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #A8A49C"><span style="width: 8px; height: 8px; border-radius: 2px; background: #F29A52"></span><span style="font-weight: 600; color: #E8E4DC">Production</span><span>9</span><span style="color: #4A4D53">/</span><span>api, db, edge</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #F29A52; border-radius: 8px; background: #17181B">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #7BC98F"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">prod-api-01</span><span class="mono" style="font-size: 11px; color: #A8A49C">18 ms</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">luis@10.0.4.21 · Domain login</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">api</span><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">k8s</span><span style="flex: 1"></span><span style="color: #F2B07A">in Deploy</span></span>
</button>
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #26292E; border-radius: 8px; background: #141518">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #7BC98F"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">prod-api-02</span><span class="mono" style="font-size: 11px; color: #A8A49C">21 ms</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">luis@10.0.4.22 · Domain login</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">api</span><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">k8s</span><span style="flex: 1"></span><span style="color: #8F8B84">2 h ago</span></span>
</button>
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #26292E; border-radius: 8px; background: #141518">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #7BC98F"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">db-primary</span><span class="mono" style="font-size: 11px; color: #A8A49C">24 ms</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">postgres@10.0.4.30 · db-admin key</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">postgres</span><span style="flex: 1"></span><span style="color: #F2B07A">in Deploy</span></span>
</button>
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #26292E; border-radius: 8px; background: #141518">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #6E6B66; box-sizing: border-box"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">edge-lb-01</span><span class="mono" style="font-size: 11px; color: #8F8B84">—</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">root@203.0.113.14 · ops key</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">haproxy</span><span style="flex: 1"></span><span style="color: #8F8B84">5 d ago</span></span>
</button>
</div>
</section>

<section aria-label="Staging" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #A8A49C"><span style="width: 8px; height: 8px; border-radius: 2px; background: #78A9F2"></span><span style="font-weight: 600; color: #E8E4DC">Staging</span><span>5</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #4A2A24; border-radius: 8px; background: #141518">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #EE7A66"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">stg-web</span><span style="font-size: 11px; color: #EE7A66">unreachable</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">luis@10.0.9.12 · Domain login</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">nginx</span><span style="flex: 1"></span><span style="color: #F2B07A">in Deploy</span></span>
</button>
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #26292E; border-radius: 8px; background: #141518">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #7BC98F"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">stg-worker</span><span class="mono" style="font-size: 11px; color: #A8A49C">33 ms</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">luis@10.0.9.20 · Domain login</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">queue</span><span style="flex: 1"></span><span style="color: #8F8B84">yesterday</span></span>
</button>
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #26292E; border-radius: 8px; background: #141518">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #6E6B66; box-sizing: border-box"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">stg-db</span><span class="mono" style="font-size: 11px; color: #8F8B84">—</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">postgres@10.0.9.30 · db-admin key</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">postgres</span><span style="flex: 1"></span><span style="color: #8F8B84">3 d ago</span></span>
</button>
<button style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 14px; border: 1px dashed #2E3137; border-radius: 8px; color: #8F8B84; font-size: 12.5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add host to Staging</button>
</div>
</section>

<section aria-label="Homelab" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #A8A49C"><span style="width: 8px; height: 8px; border-radius: 2px; background: #7BC98F"></span><span style="font-weight: 600; color: #E8E4DC">Homelab</span><span>7</span><span style="color: #4A4D53">/</span><span>proxmox, k3s</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #26292E; border-radius: 8px; background: #141518">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #7BC98F"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">pve-01</span><span class="mono" style="font-size: 11px; color: #A8A49C">2 ms</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">root@192.168.1.10 · homelab key</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">proxmox</span><span style="flex: 1"></span><span style="color: #8F8B84">1 h ago</span></span>
</button>
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #26292E; border-radius: 8px; background: #141518">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #7BC98F"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">k3s-server</span><span class="mono" style="font-size: 11px; color: #A8A49C">3 ms</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">luis@192.168.1.21 · homelab key</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">k3s</span><span style="flex: 1"></span><span style="color: #8F8B84">today</span></span>
</button>
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #26292E; border-radius: 8px; background: #141518">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #7BC98F"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">nas</span><span class="mono" style="font-size: 11px; color: #A8A49C">2 ms</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">admin@192.168.1.5 · NAS login</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">storage</span><span style="flex: 1"></span><span style="color: #8F8B84">2 d ago</span></span>
</button>
<button style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #26292E; border-radius: 8px; background: #141518">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #6E6B66; box-sizing: border-box"></span><span class="mono" style="flex: 1; font-size: 13px; font-weight: 500">pi-dns</span><span class="mono" style="font-size: 11px; color: #8F8B84">—</span></span>
<span class="mono" style="font-size: 11.5px; color: #8F8B84">pi@192.168.1.53 · homelab key</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="padding: 1px 6px; border-radius: 4px; background: #22252A; color: #C9C5BD">dns</span><span style="flex: 1"></span><span style="color: #8F8B84">3 wk ago</span></span>
</button>
</div>
</section>
</main>
</div>
</div>
</body>
</html>
