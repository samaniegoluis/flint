# git-cliff's configuration for CHANGELOG.md (milestone 32, D-077). scripts/release.sh runs
# it; nothing else should. Only release tags count (vX.Y.Z): the repo has other tags.
# Each release keeps its summary as the annotated tag's message, shown above its list.

[changelog]
header = """
# Changelog

What changed in each version of Flint, newest first. Versions follow
[SemVer](https://semver.org): a release with a new feature bumps the minor version, one
with only fixes the patch. Written by `scripts/release.sh` from the commit history.
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% if message %}
{{ message | trim }}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = ".*", skip = true },
]

[bump]
# A new feature bumps the minor even before 1.0 (0.1.3 → 0.2.0); only fixes bump the
# patch (0.1.3 → 0.1.4). 1.0.0 is given by hand (scripts/release.sh --version 1.0.0).
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
